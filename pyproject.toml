[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcpfc"
version = "0.1.0"
description = "ET4230 De 09 - TCP flow control simulation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["todo: test cho chức năng chưa hiện thực (xfail cho tới khi xong)"]
